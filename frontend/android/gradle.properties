# ==============================================================================
# GRADLE.PROPERTIES - Production-Ready Configuration
# ==============================================================================
# This file contains all build settings for a stable, repeatable build.
# DO NOT MODIFY individual settings without understanding their impact.
# ==============================================================================

# ==============================================================================
# JVM SETTINGS - Memory and Performance
# ==============================================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel project execution
org.gradle.parallel=true

# Enable configuration caching for faster builds
org.gradle.configuration-cache=false

# Enable build caching
org.gradle.caching=true

# ==============================================================================
# ANDROID SETTINGS
# ==============================================================================
# Use AndroidX libraries
android.useAndroidX=true

# Disable Jetifier (not needed with modern dependencies)
android.enableJetifier=false

# Enable non-transitive R classes (reduces APK size)
android.nonTransitiveRClass=true

# Enable AAPT2 PNG crunching for release builds
android.enablePngCrunchInReleaseBuilds=true

# Disable R8 full mode (can cause issues with some libraries)
android.enableR8.fullMode=false

# ==============================================================================
# REACT NATIVE SETTINGS
# ==============================================================================
# Build architecture - ARM64 only for faster builds and modern device support
# Change to "armeabi-v7a,arm64-v8a" if you need 32-bit support
reactNativeArchitectures=arm64-v8a

# CRITICAL: Disable New Architecture
# Reanimated 3.x and many native modules don't fully support New Architecture
newArchEnabled=false

# Use Hermes JavaScript engine (faster, smaller APK)
hermesEnabled=true

# ==============================================================================
# EXPO SETTINGS
# ==============================================================================
# Enable GIF support
expo.gif.enabled=true

# Enable WebP support
expo.webp.enabled=true
expo.webp.animated=false

# Use modern packaging (smaller APK)
expo.useLegacyPackaging=false

# Enable edge-to-edge display
expo.edgeToEdgeEnabled=true
edgeToEdgeEnabled=true

# Dev client network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# ==============================================================================
# BUILD OPTIMIZATION
# ==============================================================================
# Disable lint abort on error (prevents build failures from warnings)
android.lintOptions.abortOnError=false

# Enable incremental annotation processing
kapt.incremental.apt=true

# ==============================================================================
# SIGNING (for release builds)
# ==============================================================================
# These can be overridden by local.properties or environment variables
# RELEASE_STORE_FILE=release.keystore
# RELEASE_STORE_PASSWORD=
# RELEASE_KEY_ALIAS=
# RELEASE_KEY_PASSWORD=

# ==============================================================================
# PACKAGING OPTIONS
# ==============================================================================
# Handle duplicate native libraries
android.packagingOptions.pickFirsts=**/libc++_shared.so,**/libfbjni.so,**/libreanimated.so,**/libworklets.so
